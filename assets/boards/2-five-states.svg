<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>想走，往往是感到这五种之一</title>
  <desc>Geometry Board for the 员工离职挽救 skill.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#222222" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF" />
  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">想走，往往是感到这五种之一</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">先判断状态，再对症干预</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><text x="300" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="600" letter-spacing="0px" fill="#666666">他感到</text><text x="640" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="600" letter-spacing="0px" fill="#666666">他需要</text><rect x="180" y="200" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="300" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#111111">不被赏识</text><line x1="424" y1="226" x2="516" y2="226" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="520" y="200" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><rect x="520" y="200" width="6" height="52" fill="#2F6BFF" /><text x="640" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#2F6BFF">被重视</text><rect x="180" y="274" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="300" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#111111">孤独</text><line x1="424" y1="300" x2="516" y2="300" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="520" y="274" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><rect x="520" y="274" width="6" height="52" fill="#2F6BFF" /><text x="640" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#2F6BFF">被连接</text><rect x="180" y="348" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="300" y="380" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#111111">无聊</text><line x1="424" y1="374" x2="516" y2="374" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="520" y="348" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><rect x="520" y="348" width="6" height="52" fill="#2F6BFF" /><text x="640" y="380" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#2F6BFF">被挑战</text><rect x="180" y="422" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="300" y="454" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#111111">卡住</text><line x1="424" y1="448" x2="516" y2="448" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="520" y="422" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><rect x="520" y="422" width="6" height="52" fill="#2F6BFF" /><text x="640" y="454" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#2F6BFF">在成长</text><rect x="180" y="496" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="300" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#111111">麻木</text><line x1="424" y1="522" x2="516" y2="522" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="520" y="496" width="240" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><rect x="520" y="496" width="6" height="52" fill="#2F6BFF" /><text x="640" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="600" letter-spacing="0px" fill="#2F6BFF">有热情</text><text x="872" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#111111">先判断状态</text><text x="872" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#111111">再对症干预</text><text x="872" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">同样是想走</text><text x="872" y="394" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">无聊和卡住</text><text x="872" y="416" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">需要的完全不同</text>
</svg>
