<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>对方已有 offer 时，别先问要什么才留下</title>
  <desc>Geometry Board for the 员工离职挽救 skill.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#222222" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF" />
  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">对方已有 offer 时，别先问要什么才留下</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">理解 → 判断可信度 → 决定 counter → 保护关系</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><line x1="280" y1="330" x2="350" y2="330" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><line x1="560" y1="330" x2="618" y2="330" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><line x1="820" y1="330" x2="870" y2="330" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="96" y="284" width="184" height="92" fill="#F5F5F5" stroke="#222222" stroke-width="1.5" /><text x="188" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">对方已有 offer</text><text x="188" y="358" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">先放慢</text><circle cx="450" cy="330" r="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" /><text x="450" y="336" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34px" font-weight="700" letter-spacing="0px" fill="#666666">?</text><circle cx="700" cy="330" r="46" fill="#2F6BFF" stroke="#222222" stroke-width="1.5" /><text x="700" y="336" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">counter</text><circle cx="960" cy="330" r="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" /><circle cx="960" cy="330" r="8" fill="#2F6BFF" /><text x="200" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">理解</text><text x="200" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">为什么开始看</text><text x="450" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">判断可信度</text><text x="450" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">能否改根因</text><text x="700" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">决定 counter</text><text x="700" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">真实·快速·公平</text><text x="960" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">保护关系</text><text x="960" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">好聚好散</text><text x="600" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">别一上来就问「要什么才能留下你」——那会让关系显得纯交易</text>
</svg>
