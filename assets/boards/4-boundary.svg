<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>帮你在意人，不做监控和打分</title>
  <desc>Geometry Board for the 员工离职挽救 skill.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#222222" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF" />
  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">帮你在意人，不做监控和打分</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">只对自己成员、可复核；拒绝预测打分与背对背画像</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><rect x="112" y="196" width="476" height="340" fill="#F5F5F5" stroke="none" stroke-width="0" /><rect x="706" y="196" width="382" height="340" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1" /><line x1="647" y1="190" x2="647" y2="548" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="5 7" /><text x="350" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#666666">这枚 Skill 用来</text><text x="897" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#666666">明确拒绝</text><circle cx="250" cy="320" r="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" /><circle cx="250" cy="320" r="8" fill="#2F6BFF" /><text x="250" y="388" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">帮你更好地</text><text x="250" y="410" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">在意一个人</text><line x1="330" y1="320" x2="420" y2="320" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="432" y="288" width="120" height="64" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="492" y="316" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="600" letter-spacing="0px" fill="#111111">准备一次</text><text x="492" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="600" letter-spacing="0px" fill="#111111">真诚的谈话</text><text x="760" y="280" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" letter-spacing="0px" fill="#2F6BFF">✕</text><text x="792" y="280" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="400" letter-spacing="0px" fill="#666666">离职预测打分</text><text x="760" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" letter-spacing="0px" fill="#2F6BFF">✕</text><text x="792" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="400" letter-spacing="0px" fill="#666666">人员排序</text><text x="760" y="372" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" letter-spacing="0px" fill="#2F6BFF">✕</text><text x="792" y="372" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="400" letter-spacing="0px" fill="#666666">背对背画像</text><text x="760" y="418" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" letter-spacing="0px" fill="#2F6BFF">✕</text><text x="792" y="418" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="400" letter-spacing="0px" fill="#666666">背后监控</text><text x="350" y="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">只对自己直属成员、判断可被本人复核</text><text x="897" y="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">匿名数据不反向识别到个人</text>
</svg>
