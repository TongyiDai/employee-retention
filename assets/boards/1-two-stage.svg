  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">先给标准方案，再按核心原因个性化</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">用户信息 + 飞书证据 → 标准方案 → 追问原因 → 个性化 → 谈话</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><rect x="96" y="250" width="150" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="171" y="285" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">用户提供的信息</text><rect x="96" y="372" width="150" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="171" y="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">飞书证据（可选）</text><text x="171" y="420" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11px" font-weight="400" letter-spacing="0px" fill="#666666">1:1 · 纪要 · OKR</text><path d="M 246 280 C 300 280 300 330 348 335" fill="none" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M 246 402 C 300 402 300 350 348 345" fill="none" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)" /><rect x="360" y="292" width="150" height="96" fill="#F5F5F5" stroke="#222222" stroke-width="1.5" /><text x="435" y="324.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">标准</text><text x="435" y="346.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">挽留方案</text><text x="435" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">五状态全覆盖</text><line x1="510" y1="340" x2="566" y2="340" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><circle cx="628" cy="340" r="50" fill="#2F6BFF" stroke="#222222" stroke-width="1.5" /><text x="628" y="332.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">追问</text><text x="628" y="352.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">核心原因</text><line x1="690" y1="340" x2="746" y2="340" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="758" y="292" width="150" height="96" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" /><text x="833" y="324.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">个性化</text><text x="833" y="346.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">挽留内容</text><text x="833" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">针对性干预与脚本</text><line x1="908" y1="340" x2="964" y2="340" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><circle cx="1030" cy="340" r="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" /><text x="1030" y="333.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#111111">一次</text><text x="1030" y="352.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#111111">谈话</text><text x="600" y="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">先给可动手的标准方案，再按你判断的核心原因个性化</text>
